<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Thi HSG Sinh Học 9 - Bài Tập Tương Tác</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN để biên dịch JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Font Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    body {
      font-family: 'Nunito', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-indigo-100 min-h-screen flex items-center justify-center p-4">

  <div id="root" class="w-full max-w-2xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const quizData = [
      {
        id: 1,
        title: "Bài 1: Phân tích kì phân bào (2n = 8)",
        question: "Một loài có bộ nhiễm sắc thể (NST) lưỡng bội 2n = 8. Quan sát một tế bào thuộc loài này đang phân bào, người ta thấy có 8 NST đơn đang phân li về 2 cực của tế bào (4 NST đơn chuyển động về mỗi cực). Tế bào này đang ở kì nào của quá trình phân bào nào?",
        options: [
          { text: "Kì sau của Nguyên phân", correct: false },
          { text: "Kì sau của Giảm phân I", correct: false },
          { text: "Kì sau của Giảm phân II", correct: true },
          { text: "Kì giữa của Giảm phân II", correct: false }
        ],
        explanation: "📌 Lời giải chi tiết:\n- Bộ NST 2n = 8 ➔ n = 4.\n- Tế bào có 8 NST đơn đang phân li về 2 cực (mỗi cực 4 NST đơn).\n- Trường hợp 1: Nếu là Kì sau Nguyên phân ➔ Số NST đơn phải là 4n = 16 NST đơn (mỗi cực 8). ➔ Loại.\n- Trường hợp 2: Nếu là Kì sau Giảm phân I ➔ Các NST kép tương đồng phân li, số NST là 2n = 8 NST kép. ➔ Loại.\n- Trường hợp 3: Ở Kì sau Giảm phân II ➔ Mỗi tế bào chứa n = 4 NST kép tách thành 8 NST đơn phân li về 2 cực (mỗi cực n = 4 NST đơn). ➔ Chính xác!"
      },
      {
        id: 2,
        title: "Bài 2: Tỉ lệ giao tử đột biến (2n = 24)",
        question: "Một loài thực vật tự thụ phấn có bộ NST 2n = 24. Trong quá trình phát sinh giao tử, có 20% tế bào sinh giao tử đực có 1 cặp NST (cặp số 5) không phân li trong Giảm phân I, Giảm phân II diễn ra bình thường. Trong số các giao tử đực tạo ra, giao tử đột biến chứa 13 NST (n + 1) chiếm tỉ lệ bao nhiêu?",
        options: [
          { text: "5%", correct: false },
          { text: "10%", correct: true },
          { text: "20%", correct: false },
          { text: "80%", correct: false }
        ],
        explanation: "📌 Lời giải chi tiết:\n- Số NST bình thường n = 12. Giao tử chứa 13 NST là giao tử n + 1 = 13.\n- Xét 20% tế bào sinh giao tử đực bị rối loạn ở GP I:\n  + Khi 1 cặp NST không phân li ở GP I sẽ tạo ra 2 loại giao tử đột biến với tỉ lệ bằng nhau là: (n + 1) và (n - 1).\n  + Do đó, 20% tế bào này tạo ra 10% giao tử (n + 1) và 10% giao tử (n - 1).\n- Vậy tỉ lệ giao tử đực chứa 13 NST (n + 1) là: 20% × 0,5 = 10%."
      },
      {
        id: 3,
        title: "Bài 3: Tỉ lệ hợp tử đột biến (2n = 24)",
        question: "Ở loài thực vật 2n = 24 nói trên, 20% tế bào sinh giao tử đực và 10% tế bào sinh giao tử cái bị rối loạn không phân li 1 cặp NST ở GP I. Cho các giao tử thụ tinh tự do, tính tỉ lệ hợp tử có 25 NST (2n + 1) tạo thành?",
        options: [
          { text: "5%", correct: false },
          { text: "9%", correct: false },
          { text: "13%", correct: true },
          { text: "18%", correct: false }
        ],
        explanation: "📌 Lời giải chi tiết:\n- Hợp tử có 25 NST chính là thể ba (2n + 1 = 25).\n- Tỉ lệ các loại giao tử:\n  + Giao tử đực: 10% (n + 1), 10% (n - 1), 80% (n).\n  + Giao tử cái: 5% (n + 1), 5% (n - 1), 90% (n).\n- Hợp tử 2n + 1 (25 NST) được hình thành từ 2 trường hợp:\n  1. Đực (n + 1) × Cái (n) = 10% × 90% = 9%\n  2. Đực (n) × Cái (n + 1) = 80% × 5% = 4%\n- Tổng tỉ lệ hợp tử 2n + 1 = 9% + 4% = 13%."
      },
      {
        id: 4,
        title: "Bài 4: Phân biệt không phân li ở GP II",
        question: "Một tế bào sinh tinh có kiểu gen AaBb giảm phân. Giảm phân I diễn ra bình thường. Ở Giảm phân II, cặp Aa không phân li ở một trong hai tế bào con, cặp Bb phân li bình thường. Các giao tử được tạo ra từ tế bào sinh tinh này có thể là:",
        options: [
          { text: "AaB, Aab, O", correct: false },
          { text: "AAB, B, ab (hoặc aaB, B, Ab)", correct: true },
          { text: "AAB, aB, b", correct: false },
          { text: "AB, Ab, aB, ab", correct: false }
        ],
        explanation: "📌 Lời giải chi tiết:\n- GP I bình thường tạo 2 tế bào con: (AABB và aabb) hoặc (AAbb và aaBB).\n- Giả sử tế bào 1 chứa AABB, tế bào 2 chứa aabb.\n- Ở GP II, nếu tế bào 1 bị rối loạn cặp AA không phân li ➔ tạo ra giao tử AAB và B.\n- Tế bào 2 giảm phân II bình thường ➔ tạo 2 giao tử ab.\n- Kết quả tạo các loại giao tử: AAB, B, ab."
      },
      {
        id: 5,
        title: "Bài 5: Số lượng NST trong tế bào đột biến",
        question: "Một loài sinh vật có 2n = 8. Một tế bào sinh dưỡng của thể đột biến thể một (2n - 1) đang ở kì sau của quá trình nguyên phân. Số NST đơn trong tế bào lúc này là bao nhiêu?",
        options: [
          { text: "7 NST đơn", correct: false },
          { text: "14 NST đơn", correct: true },
          { text: "16 NST đơn", correct: false },
          { text: "8 NST đơn", correct: false }
        ],
        explanation: "📌 Lời giải chi tiết:\n- Thể một có bộ NST là 2n - 1 = 8 - 1 = 7 NST.\n- Ở kì giữa của nguyên phân, tế bào có 7 NST kép.\n- Khi bước vào kì sau của nguyên phân, các tâm động tách ra, mỗi NST kép tách thành 2 NST đơn.\n- Do đó, số NST đơn trong tế bào ở kì sau nguyên phân là: 7 × 2 = 14 NST đơn."
      },
      {
        id: 6,
        title: "Bài 6: Tỉ lệ trứng đột biến",
        question: "Nếu có 100 tế bào sinh trứng có kiểu gen Aa tiến hành giảm phân. Trong đó có 10 tế bào xảy ra hiện tượng cặp Aa không phân li trong Giảm phân I, Giảm phân II bình thường. Tỉ lệ trứng mang gen Aa được tạo ra là bao nhiêu?",
        options: [
          { text: "10%", correct: false },
          { text: "5%", correct: true },
          { text: "2.5%", correct: false },
          { text: "20%", correct: false }
        ],
        explanation: "📌 Lời giải chi tiết:\n- Đối với tế bào sinh trứng: Mỗi tế bào sinh trứng qua giảm phân chỉ tạo ra 1 TRỨNG DUY NHẤT và 3 thể cực.\n- 10 tế bào bị rối loạn ở GP I (cặp Aa không phân li) sẽ tạo ra:\n  + 50% số trứng mang NST Aa (n + 1).\n  + 50% số trứng không mang NST nào của cặp này (O, n - 1).\n  ➔ 10 tế bào này tạo ra 5 trứng Aa và 5 trứng O.\n- 90 tế bào giảm phân bình thường tạo ra 90 trứng bình thường.\n- Tổng số trứng tạo thành = 100 trứng.\n- Tỉ lệ trứng mang gen Aa là: 5 / 100 = 5%."
      }
    ];

    function App() {
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);
      const [score, setScore] = useState(0);
      const [quizFinished, setQuizFinished] = useState(false);

      const handleSelectOption = (index) => {
        if (selectedOption !== null) return;
        setSelectedOption(index);
        setShowExplanation(true);

        const isCorrect = quizData[currentQuestion].options[index].correct;
        if (isCorrect) {
          setScore(prev => prev + 1);
        }
      };

      const handleNext = () => {
        if (currentQuestion < quizData.length - 1) {
          setCurrentQuestion(prev => prev + 1);
          setSelectedOption(null);
          setShowExplanation(false);
        } else {
          setQuizFinished(true);
        }
      };

      const handleRestart = () => {
        setCurrentQuestion(0);
        setSelectedOption(null);
        setShowExplanation(false);
        setScore(0);
        setQuizFinished(false);
      };

      return (
        <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-2xl border border-white/50">
          {/* Header */}
          <div className="text-center mb-6">
            <span className="inline-block bg-pink-100 text-pink-700 font-bold px-4 py-1.5 rounded-full text-xs mb-2 border border-pink-200">
              ✨ Ôn Thi HSG Sinh Học 9 ✨
            </span>
            <h1 className="text-2xl md:text-3xl font-extrabold text-purple-900">
              🧪 Đột Biến NST & Giảm Phân 🧬
            </h1>
          </div>

          {!quizFinished ? (
            <div>
              {/* Progress Bar */}
              <div className="mb-6">
                <div className="flex justify-between items-center text-xs font-bold text-purple-600 mb-2">
                  <span>Câu hỏi {currentQuestion + 1} / {quizData.length}</span>
                  <span className="bg-purple-100 text-purple-800 px-3 py-1 rounded-full">
                    Điểm: {score} ⭐
                  </span>
                </div>
                <div className="w-full bg-purple-100 h-3 rounded-full overflow-hidden p-0.5">
                  <div 
                    className="bg-gradient-to-r from-pink-400 to-purple-500 h-full rounded-full transition-all duration-300"
                    style={{ width: `${((currentQuestion + 1) / quizData.length) * 100}%` }}
                  ></div>
                </div>
              </div>

              {/* Question */}
              <div className="bg-purple-50/70 rounded-2xl p-5 border border-purple-100 mb-5">
                <span className="inline-block bg-purple-200 text-purple-800 text-xs font-bold px-2.5 py-1 rounded mb-2">
                  {quizData[currentQuestion].title}
                </span>
                <p className="text-gray-800 font-semibold text-base md:text-lg leading-relaxed">
                  {quizData[currentQuestion].question}
                </p>
              </div>

              {/* Options */}
              <div className="space-y-3 mb-6">
                {quizData[currentQuestion].options.map((option, idx) => {
                  let btnStyle = "bg-white hover:bg-purple-50 text-gray-700 border-gray-200";
                  
                  if (selectedOption !== null) {
                    if (option.correct) {
                      btnStyle = "bg-green-100 text-green-800 border-green-400 font-bold shadow-sm";
                    } else if (selectedOption === idx) {
                      btnStyle = "bg-red-100 text-red-800 border-red-400 shadow-sm";
                    } else {
                      btnStyle = "bg-gray-50 text-gray-400 border-gray-100 opacity-60";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => handleSelectOption(idx)}
                      disabled={selectedOption !== null}
                      className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center justify-between text-sm md:text-base ${btnStyle}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className="w-7 h-7 rounded-lg bg-purple-100 text-purple-700 font-bold flex items-center justify-center text-xs shrink-0">
                          {String.fromCharCode(65 + idx)}
                        </span>
                        <span>{option.text}</span>
                      </div>
                      {selectedOption !== null && (
                        option.correct ? <span className="text-green-600 font-bold">✓</span> 
                        : selectedOption === idx ? <span className="text-red-500 font-bold">✕</span> 
                        : null
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Explanation */}
              {showExplanation && (
                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 text-xs md:text-sm text-amber-900 leading-relaxed">
                  <div className="font-bold text-amber-800 mb-1 flex items-center gap-1">
                    💡 <span>Giải Thích Tỉ Mỉ:</span>
                  </div>
                  <div className="whitespace-pre-line">
                    {quizData[currentQuestion].explanation}
                  </div>
                </div>
              )}

              {/* Next Button */}
              {selectedOption !== null && (
                <button
                  onClick={handleNext}
                  className="w-full bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all duration-200"
                >
                  {currentQuestion === quizData.length - 1 ? "Xem Kết Quả Tổng Kết" : "Câu Tiếp Theo ➔"}
                </button>
              )}
            </div>
          ) : (
            /* Result Screen */
            <div className="text-center py-6">
              <div className="text-5xl mb-3">🏆</div>
              <h2 className="text-2xl font-black text-purple-900 mb-2">
                Hoàn Thành Bài Tập!
              </h2>
              <p className="text-sm text-gray-600 mb-6">
                Bạn đã hoàn thành các bài tập nâng cao Giảm phân & Đột biến NST.
              </p>

              <div className="bg-gradient-to-r from-purple-50 to-pink-50 rounded-2xl p-6 border border-purple-100 mb-6">
                <div className="text-4xl font-black text-purple-700 mb-2">
                  {score} / {quizData.length}
                </div>
                <p className="text-xs font-bold text-purple-600">
                  {score === quizData.length 
                    ? "Xuất sắc tuyệt đối! Bạn nắm rất vững kiến thức HSG! 🌟" 
                    : score >= 4 
                    ? "Kết quả rất tốt! Hãy củng cố lại các câu sai nhé! 👍" 
                    : "Hãy đọc kĩ lời giải và thử lại lần nữa nào! 💪"}
                </p>
              </div>

              <button
                onClick={handleRestart}
                className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition-all duration-200"
              >
                🔄 Làm Lại Bài Tập
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
